# SEA THE ANSWER — run everything from the repository root.
#
#   docker compose up --build -d                       # app (production builds) → http://localhost:5173
#   docker compose run --rm migrate new <name>          # new migration file in migrations/
#   docker compose -f compose.yaml -f compose.dev.yaml up --build   # development (hot reload)
#   docker compose --profile e2e up --build --force-recreate --exit-code-from e2e e2e  # end-to-end tests, isolated DB
#   docker compose --profile e2e down                                # stop the e2e stack afterwards
#
# Settings come from the root .env (copy .env.example). See README.md.
name: haedap

x-database-env: &database-env
  POSTGRES_DB: ${POSTGRES_DB:-haedap}
  POSTGRES_USER: ${POSTGRES_USER:-haedap}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haedap-local}

x-db: &db
  image: postgres:18-alpine
  environment: *database-env
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 2s
    timeout: 3s
    retries: 30

# DB migrations (migrations/, dbmate — ADR 0010). Runs once and exits; backend waits for it.
x-migrate: &migrate
  image: amacneil/dbmate:2.36.0
  environment: &migrate-env
    DBMATE_MIGRATIONS_DIR: /db/migrations
    DBMATE_NO_DUMP_SCHEMA: "true"
    DBMATE_WAIT: "true"
  volumes:
    - ./migrations:/db/migrations
  command: ["up"]
  restart: "no"

x-backend-env: &backend-env
  HAEDAP_BOOTSTRAP_USERNAME: ${HAEDAP_BOOTSTRAP_USERNAME:-}
  HAEDAP_BOOTSTRAP_NAME: ${HAEDAP_BOOTSTRAP_NAME:-}
  HAEDAP_BOOTSTRAP_PASSWORD: ${HAEDAP_BOOTSTRAP_PASSWORD:-}
  HAEDAP_HTTPS: ${HAEDAP_HTTPS:-false}
  # Optional: grounded model responses (server-side only).
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DONGUK_AI_CHAT_API_KEY: ${DONGUK_AI_CHAT_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  HAEDAP_PLANNER_MODEL: ${HAEDAP_PLANNER_MODEL:-}
  LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
  LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-text}
  LLM_GENERATION_TIMEOUT_SECONDS: ${LLM_GENERATION_TIMEOUT_SECONDS:-60}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
  LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-}
  # Optional: mounts /api/maritime-data/* (ADR 0008). Empty = disabled.
  MARITIME_DATA_API_TOKEN: ${MARITIME_DATA_API_TOKEN:-}
  MARITIME_DATA_DATABASE_URL: ${MARITIME_DATA_DATABASE_URL:-}

services:
  db:
    <<: *db
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped

  # Applies pending migrations on every `up`, then exits.
  # New migration: docker compose run --rm migrate new <name>   (see README)
  migrate:
    <<: *migrate
    environment:
      <<: *migrate-env
      DATABASE_URL: postgres://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@db:5432/${POSTGRES_DB:-haedap}?sslmode=disable
    depends_on:
      db: { condition: service_healthy }

  backend:
    build: { context: ./backend, target: prod }
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@db:5432/${POSTGRES_DB:-haedap}
      # Extra public hostnames/IPs users open (LAN, server domain). localhost is always allowed.
      HAEDAP_ALLOWED_HOSTS: ${HAEDAP_ALLOWED_HOSTS:-}
      HAEDAP_RAG_CANDIDATES: ${HAEDAP_RAG_CANDIDATES:-30}
      HAEDAP_RRF_K: ${HAEDAP_RRF_K:-60}
      HAEDAP_EMBED_MODEL_DIR: /opt/models/e5-small
      HAEDAP_CHROMA_HOST: chroma
      HAEDAP_CHROMA_PORT: "8000"
      HAEDAP_OPENSEARCH_URL: http://opensearch:9200
      HF_HUB_DISABLE_TELEMETRY: "1"
      HAEDAP_IMPORT_DIR: /data/imports
    volumes:
      - backups:/data/backups
      - maritime-imports:/data/imports
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # Not published: only reachable through the frontend's /api proxy.
    networks: [default, lexical]

  lexical-worker:
    build: { context: ./backend, target: prod }
    command: ["python", "-m", "api.rag_lexical_worker", "run"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@db:5432/${POSTGRES_DB:-haedap}
      HAEDAP_OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      migrate: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [default, lexical]
    stop_grace_period: 60s
    restart: unless-stopped

  # Trusted local development only: no public port, dedicated internal network.
  opensearch:
    build: { context: ./backend, dockerfile: Dockerfile.opensearch }
    environment: &opensearch-env
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    networks: [lexical]
    volumes: [lexical-data:/usr/share/opensearch/data]
    restart: unless-stopped

  # Automatic indexing runs after document commits, independently of searches.
  rag-worker:
    build: { context: ./backend, target: prod }
    command: ["python", "-m", "api.rag_worker", "run"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@db:5432/${POSTGRES_DB:-haedap}
      HAEDAP_CHROMA_HOST: chroma
      HAEDAP_CHROMA_PORT: "8000"
      HAEDAP_EMBED_MODEL_DIR: /opt/models/e5-small
    depends_on:
      migrate: { condition: service_completed_successfully }
      chroma: { condition: service_healthy }
    healthcheck:
      disable: true
    stop_grace_period: 60s
    restart: unless-stopped

  # Internal vector index; never publishes a host port.
  chroma:
    build: { context: ./backend, dockerfile: Dockerfile.chroma }
    environment:
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - rag-vectors:/data/chroma
    restart: unless-stopped

  frontend:
    build: { context: ./frontend, target: prod }
    environment:
      HAEDAP_API_ORIGIN: http://backend:8000
    ports:
      # HAEDAP_BIND=0.0.0.0 to accept LAN/server traffic.
      - "${HAEDAP_BIND:-127.0.0.1}:${PORT:-5173}:5173"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # ---- End-to-end tests (profile "e2e") -------------------------------------------
  # A separate stack with an in-memory database, so tests never touch app data.
  # Nothing is published to the host. When `e2e` exits, Compose stops only that container:
  # e2e-db/backend/frontend keep running, so always pass --force-recreate (fresh, empty DB
  # every run) and clean up with `docker compose --profile e2e down`.
  # Do NOT use --attach-dependencies: e2e-migrate's normal exit aborts the run before tests
  # start and still returns exit code 0.
  e2e-db:
    <<: *db
    profiles: [e2e]
    tmpfs: [/var/lib/postgresql]

  e2e-migrate:
    <<: *migrate
    profiles: [e2e]
    environment:
      <<: *migrate-env
      DATABASE_URL: postgres://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@e2e-db:5432/${POSTGRES_DB:-haedap}?sslmode=disable
    depends_on:
      e2e-db: { condition: service_healthy }

  e2e-backend:
    build: { context: ./backend, target: prod }
    profiles: [e2e]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@e2e-db:5432/${POSTGRES_DB:-haedap}
      HAEDAP_ALLOWED_HOSTS: e2e-frontend
      # Credentials for the disposable, unpublished test stack only.
      HAEDAP_BOOTSTRAP_USERNAME: e2e-admin
      HAEDAP_BOOTSTRAP_NAME: E2E administrator
      HAEDAP_BOOTSTRAP_PASSWORD: E2e-initial-only-2026
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      HAEDAP_IMPORT_DIR: /data/imports
      HAEDAP_OPENSEARCH_URL: http://e2e-opensearch:9200
    tmpfs: ["/data/backups:uid=10001,gid=10001", "/data/imports:uid=10001,gid=10001"]
    depends_on:
      e2e-migrate: { condition: service_completed_successfully }

  e2e-opensearch:
    build: { context: ./backend, dockerfile: Dockerfile.opensearch }
    profiles: [e2e]
    environment: *opensearch-env
    mem_limit: 2g
    tmpfs: ["/usr/share/opensearch/data:uid=1000,gid=1000"]

  e2e-lexical-worker:
    build: { context: ./backend, target: prod }
    profiles: [e2e]
    command: ["python", "-m", "api.rag_lexical_worker", "run"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@e2e-db:5432/${POSTGRES_DB:-haedap}
      HAEDAP_OPENSEARCH_URL: http://e2e-opensearch:9200
    healthcheck: { disable: true }
    depends_on:
      e2e-lexical-ready: { condition: service_completed_successfully }

  e2e-lexical-ready:
    build: { context: ./backend, target: prod }
    profiles: [e2e]
    command: ["python", "-m", "api.rag_lexical_worker", "run", "--drain"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haedap}:${POSTGRES_PASSWORD:-haedap-local}@e2e-db:5432/${POSTGRES_DB:-haedap}
      HAEDAP_OPENSEARCH_URL: http://e2e-opensearch:9200
    healthcheck: { disable: true }
    depends_on:
      e2e-backend: { condition: service_healthy }
      e2e-opensearch: { condition: service_healthy }

  e2e-frontend:
    build: { context: ./frontend, target: prod }
    profiles: [e2e]
    environment:
      HAEDAP_API_ORIGIN: http://e2e-backend:8000
    depends_on:
      e2e-backend: { condition: service_healthy }

  e2e:
    build: ./e2e
    profiles: [e2e]
    environment:
      E2E_BASE_URL: http://e2e-frontend:5173
      CI: "1"
    volumes:
      # Screenshots, traces and the HTML report land in e2e/ on the host.
      - ./e2e/test-results:/e2e/test-results
      - ./e2e/playwright-report:/e2e/playwright-report
    depends_on:
      e2e-frontend: { condition: service_healthy }
      e2e-lexical-worker: { condition: service_started }

volumes:
  db-data:
  backups:
  maritime-imports:
  # Legacy rag-models volume is intentionally not mounted or deleted.
  rag-vectors:
  lexical-data:

networks:
  lexical:
    internal: true
